<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETH Сигналы">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ETH Сигналы</title>
<style>
:root{
  --bg:#0e1117; --panel:#131822; --panel2:#19202c; --line:#232b38; --text:#d7dde6; --muted:#8b95a5;
  --up:#2ecc71; --down:#ff5b5b; --accent:#4aa3ff; --warn:#f5a623; --tabs:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
h3{margin:16px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h3:first-child{margin-top:4px}

#app{height:100dvh;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--tabs) + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;gap:10px;padding:8px 12px 4px}
.sym{font-weight:700;font-size:16px}.sym span{color:var(--muted);font-weight:500}
#price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
#price.up{color:var(--up)}#price.down{color:var(--down)}
#conn{width:9px;height:9px;border-radius:50%;background:var(--muted)}
#conn.live{background:var(--up)}#conn.connecting{background:var(--warn)}#conn.off{background:var(--down)}

#tfbar{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
#tfbar::-webkit-scrollbar{display:none}
#tfbar button{flex:1 0 auto;min-width:46px;padding:7px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600}
#tfbar button.on{background:var(--accent);border-color:var(--accent);color:#06121f}

#banner,#hint{margin:0 12px 6px;padding:8px 10px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer}
#banner.long{background:rgba(46,204,113,.16);border:1px solid rgba(46,204,113,.5)}
#banner.short{background:rgba(255,91,91,.16);border:1px solid rgba(255,91,91,.5)}
#banner.warn{background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.45)}
#hint{background:rgba(74,163,255,.15);border:1px solid rgba(74,163,255,.5);justify-content:space-between}
/* подсказка поверх графика (внизу, над StochRSI), а не в потоке: иначе график при постановке линии съезжает на ~60 px */
#hint{position:absolute;left:0;right:0;bottom:8px;z-index:9;margin:0 12px;background:#12253a;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:default}
#hint .btn{padding:6px 12px}
[hidden]{display:none!important}

#charts{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.wrap{position:relative;min-height:0}
#priceWrap{flex:3}#stochWrap{flex:1.25;border-top:1px solid var(--line)}
.wrap>div.chart{position:absolute;inset:0}
.legend{position:absolute;left:8px;top:6px;z-index:5;font-size:12px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.legend b{color:var(--text)}
.tools{position:absolute;left:8px;top:28px;z-index:6;display:flex;gap:6px}
.tools button{padding:6px 10px;border-radius:8px;background:rgba(19,24,34,.88);border:1px solid var(--line);font-size:13px}
.tools button.on{background:var(--warn);border-color:var(--warn);color:#241600}
#loading{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
#loading .err{color:var(--down);max-width:420px}

/* боковая панель / нижний лист */
#side{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
#panel{display:none;height:min(62dvh,560px);overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
#side.open #panel{display:block}
#tabs{display:flex;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel)}
#tabs button{flex:1;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
#tabs button.on{color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
#tabs b{font-size:11px;background:var(--panel2);border-radius:10px;padding:1px 7px;color:var(--text)}
#tabs b.hot{background:var(--accent);color:#06121f}

@media (min-width:980px){
  #app{flex-direction:row}
  #main{padding-bottom:0}
  #side{position:static;width:400px;flex:none;flex-direction:column-reverse;border-top:0;border-left:1px solid var(--line)}
  #panel{display:block!important;flex:1;height:auto}
  #tabs{height:48px;padding-bottom:0;border-bottom:1px solid var(--line)}
}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.card.long{border-left:3px solid var(--up)}.card.short{border-left:3px solid var(--down)}.card.warn{border-left:3px solid var(--warn)}
.card .top{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line)}
.badge.long{background:rgba(46,204,113,.2);color:var(--up)}.badge.short{background:rgba(255,91,91,.2);color:var(--down)}.badge.warn{background:rgba(245,166,35,.2);color:var(--warn)}
.muted{color:var(--muted)}.small{font-size:12px}
.right{margin-left:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px}
td{padding:7px 6px;border-top:1px solid var(--line)}
tr.cur td{background:rgba(74,163,255,.08)}
tr[data-tf]{cursor:pointer}
.ob{color:var(--down);font-weight:700}.os{color:var(--up);font-weight:700}

.btn{padding:9px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f}
.btn.danger{color:var(--down)}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row.sp{justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;background:var(--panel2);color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:#06121f}
.seg button.on.sup{background:var(--up)}.seg button.on.res{background:var(--down)}.seg button.on.liq{background:var(--warn)}
label.f{display:block;margin:10px 0 0;font-size:12px;color:var(--muted)}
label.f>*{margin-top:4px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .dot{width:10px;height:10px;border-radius:3px;flex:none}
.lvl .p{font-weight:700;font-variant-numeric:tabular-nums}
.lvl .ico{padding:6px 9px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.sw input{width:auto;accent-color:var(--accent);transform:scale(1.3)}
textarea{height:96px;font:12px/1.3 ui-monospace,Menlo,monospace;resize:vertical}

#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:460px;background:var(--panel);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media (min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:14px}}
#modal h2{margin:0 0 6px;font-size:16px}
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{max-width:480px;width:100%;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:13px}
.toast.long{border-color:var(--up)}.toast.short{border-color:var(--down)}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <header>
      <div class="sym">ETH<span>/USDT</span></div>
      <div id="conn" title="Соединение с Binance"></div>
      <div id="price">—</div>
    </header>
    <nav id="tfbar"></nav>
    <div id="banner" hidden></div>
    <main id="charts">
      <div id="loading"><div id="loadingText">Загрузка данных Binance…</div></div>
      <div id="hint" hidden><span>Тапните по графику, где поставить линию</span><button class="btn" id="hintCancel">Отмена</button></div>
      <div class="wrap" id="priceWrap">
        <div class="legend" id="legend"></div>
        <div class="tools">
          <button id="btnAdd">＋ Линия</button>
          <button id="btnEdit" title="Перетаскивать линии пальцем">✎ Правка</button>
        </div>
        <div class="chart" id="priceChart"></div>
      </div>
      <div class="wrap" id="stochWrap">
        <div class="legend" id="stochLegend"></div>
        <div class="chart" id="stochChart"></div>
      </div>
    </main>
  </div>

  <aside id="side">
    <section id="panel"></section>
    <nav id="tabs">
      <button data-tab="signals">Сигналы <b id="sigCount">0</b></button>
      <button data-tab="lines">Линии <b id="lineCount">0</b></button>
      <button data-tab="settings">Настройки</button>
    </nav>
  </aside>
</div>

<div id="modal" hidden><div class="sheet" id="modalBody"></div></div>
<div id="toasts"></div>

<script src="lightweight-charts.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
